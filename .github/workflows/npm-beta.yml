name: Publish npm beta
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-beta
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check release identity
        run: node scripts/check-beta-release.mjs
      - run: npm ci
      - run: npm run build:pages
      - run: npm test
      - run: npm run verify:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Publish with the beta tag
        run: npm publish -w ./packages/toolkit --tag beta --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
